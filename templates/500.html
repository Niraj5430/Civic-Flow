{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 animate-in fade-in zoom-in duration-700">
    <div class="relative mb-12">
        <div class="absolute inset-0 bg-slate-900 blur-3xl opacity-20 rounded-full scale-150"></div>
        <div class="w-32 h-32 bg-slate-950 rounded-[2.5rem] flex items-center justify-center text-brand-500 shadow-2xl shadow-slate-950/50 mx-auto relative z-10">
            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div class="absolute -top-4 -right-4 bg-slate-900 text-white text-xs font-black px-3 py-1.5 rounded-lg shadow-xl uppercase tracking-tighter">
            System Error
        </div>
    </div>

    <h1 class="text-5xl font-black font-display text-slate-100 mb-6 tracking-tight leading-tight">
        Something went <span class="text-brand-500 underline decoration-brand-200 underline-offset-8">wrong.</span>
    </h1>
    <p class="text-lg text-slate-400 max-w-2xl mx-auto mb-12 leading-relaxed font-medium">
        The page could not be loaded right now. Try refreshing or go back to a safe page.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-6 w-full max-w-md">
        <button onclick="window.location.reload()" class="bg-slate-900 hover:bg-slate-800 text-white px-10 py-5 rounded-2xl font-extrabold text-lg transition-all shadow-2xl shadow-slate-950/40 active:scale-[0.98] w-full flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Refresh Page
        </button>
        <a href="{% url 'dashboard' %}" class="bg-slate-800 hover:bg-slate-700 text-white px-10 py-5 rounded-2xl font-bold text-lg border border-slate-700 transition-all w-full shadow-lg shadow-slate-950/30 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
        </a>
    </div>

    <div class="mt-24 p-8 bg-slate-950/80 rounded-3xl border border-slate-800 backdrop-blur-sm max-w-2xl w-full">
        <div class="flex flex-col md:flex-row items-center gap-6 justify-between">
            <div class="text-left">
                <p class="text-sm font-black text-slate-400 uppercase tracking-widest mb-1">Status Code 500</p>
                <p class="text-xs text-slate-500 font-bold">Internal Server Error — page unavailable.</p>
            </div>
            <div class="flex -space-x-3 overflow-hidden">
                <div class="inline-block h-10 w-10 rounded-full ring-4 ring-slate-950 bg-brand-200 flex items-center justify-center text-brand-600 font-bold text-xs">JD</div>
                <div class="inline-block h-10 w-10 rounded-full ring-4 ring-slate-950 bg-emerald-200 flex items-center justify-center text-emerald-600 font-bold text-xs">AL</div>
                <div class="inline-block h-10 w-10 rounded-full ring-4 ring-slate-950 bg-amber-200 flex items-center justify-center text-amber-600 font-bold text-xs">SK</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
