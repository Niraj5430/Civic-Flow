{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 animate-in fade-in zoom-in duration-700">
    <div class="relative mb-8">
        <div class="absolute inset-0 bg-slate-900 blur-3xl opacity-20 rounded-full scale-150"></div>
        <h1 class="relative text-[10rem] font-black font-display text-slate-100 leading-none select-none">
            404
        </h1>
        <p class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-2 rounded-2xl font-bold text-xl shadow-xl shadow-slate-900/30">
            Lost?
        </p>
    </div>

    <h2 class="text-4xl font-bold font-display text-slate-100 mb-4">Page Not Found</h2>
    <p class="text-lg text-slate-400 max-w-xl mx-auto mb-10 leading-relaxed font-medium">
        The page you are looking for doesn't exist or may have moved. Use the buttons below to return safely.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-xl">
        <a href="{% url 'home' %}" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-8 py-4 rounded-2xl font-extrabold text-lg transition-all shadow-xl shadow-slate-900/30 active:scale-[0.98] w-full sm:w-auto">
            <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Home
        </a>
        <button onclick="history.back()" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-8 py-4 rounded-2xl font-bold text-lg border border-slate-700 transition-all w-full sm:w-auto">
            Go Back
        </button>
    </div>
</div>
{% endblock %}
